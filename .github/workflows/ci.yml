name: Tests and installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    defaults:
      run:
        working-directory: kresus
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      # Tauri's Linux WebView and native menu require GTK and WebKitGTK development files.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: kresus/.nvmrc
          check-latest: true

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Check formatting
        if: runner.os == 'Linux'
        run: yarn format:check

      - name: TypeScript tests
        run: yarn test

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Database generator tests
        run: python -m unittest discover -s scripts/tests

      # Build installers only after tests; keep them as workflow artifacts, not releases.
      - name: Build Debian package
        if: runner.os == 'Linux'
        run: yarn tauri build --bundles deb

      - name: Build Windows installers
        if: runner.os == 'Windows'
        # Bash preserves the comma-separated argument instead of treating it as an array.
        shell: bash
        run: yarn tauri build --bundles nsis,msi

      - name: Upload Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: kresus-linux-deb
          path: kresus/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows NSIS installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: kresus-windows-nsis
          path: kresus/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows MSI installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: kresus-windows-msi
          path: kresus/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
