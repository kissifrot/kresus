name: Tests and installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    defaults:
      run:
        working-directory: kresus
    steps:
      - name: Check out sources
        uses: actions/checkout@v7.0.1

      # Tauri's Linux WebView and native menu require GTK and WebKitGTK development files.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils webkitgtk-webdriver xvfb xauth dbus-x11 at-spi2-core

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: kresus/.nvmrc
          check-latest: true

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: kresus/src-tauri -> target

      - name: Install Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Check formatting
        if: runner.os == 'Linux'
        run: yarn format:check

      - name: TypeScript tests
        run: yarn test

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Database generator tests
        run: python -m unittest discover -s scripts/tests

      # Exercise the real Linux WebView with disposable application data.
      - name: Install Tauri WebDriver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Build debug application for WebDriver
        if: runner.os == 'Linux'
        run: yarn tauri build --debug --no-bundle --features e2e

      - name: Run Tauri WebDriver smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- yarn test:e2e
        env:
          GDK_BACKEND: x11

      # Build installers only after tests; retain them as workflow artifacts.
      - name: Build Debian package
        if: runner.os == 'Linux'
        run: yarn tauri build --bundles deb

      # Verify the packaged launcher, not only its source template.
      - name: Verify Debian file association
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          test -n "$package"
          inspection_dir=$(mktemp -d)
          trap 'rm -rf "$inspection_dir"' EXIT
          dpkg-deb -x "$package" "$inspection_dir"
          grep -Fx 'Exec=kresus %f' "$inspection_dir/usr/share/applications/Kresus.desktop"
          grep -Fx 'MimeType=application/x-kresus;' "$inspection_dir/usr/share/applications/Kresus.desktop"
          test -f "$inspection_dir/usr/share/mime/packages/kresus.xml"

      - name: Build Windows installers
        if: runner.os == 'Windows'
        # Bash preserves the comma-separated argument instead of treating it as an array.
        shell: bash
        run: yarn tauri build --bundles nsis,msi

      - name: Upload Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kresus-linux-deb
          path: kresus/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows NSIS installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kresus-windows-nsis
          path: kresus/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows MSI installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kresus-windows-msi
          path: kresus/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  publish-preview:
    name: Publish preview
    needs: test-and-build
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'preview-')
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PREVIEW_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7.0.1
      - name: Publish prerelease
        shell: bash
        run: bash kresus/scripts/publish-preview.sh
